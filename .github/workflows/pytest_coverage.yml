name: pytest with coverage

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coverage:
    name: Run pytest with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        # Pin the version (locking) and force wheels (no setup-script execution).
        run: "pip install --only-binary=:all: uv==0.11.21"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          # --only-binary=:all: forbids building from sdists (no setup.py execution);
          # versions are pinned to lock the resolved dependencies.
          uv pip install --only-binary=:all: torch==2.13.0+cpu torchaudio==2.11.0+cpu torchvision==0.28.0+cpu --index-url https://download.pytorch.org/whl/cpu
          # Local package: editable install of this repo's own trusted source
          # (cannot be binary-only). SonarQube hotspot on this line must be
          # reviewed/marked "Safe" in the UI; it recurs if this line is edited.
          uv pip install -e .
          # Fully pinned lockfile locks resolved versions (regenerate when
          # requirements-test.txt changes — see header in requirements-test.lock).
          uv pip install --only-binary=:all: -r requirements-test.lock

      - name: Run pytest with coverage
        run: |
          source .venv/bin/activate
          pytest --cov=nkululeko --cov-branch tests/
        continue-on-error: false

