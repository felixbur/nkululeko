name: pytest with coverage

on:
  push:
    branches:
      - master
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  coverage:
    name: Run pytest with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        # Pin the version (locking) and force wheels (no setup-script execution).
        run: "pip install --only-binary=:all: uv==0.11.21"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          # Editable install of this repo's own trusted source (local package;
          # binary-only is N/A). The SonarQube hotspot on this line must be
          # reviewed and marked "Safe" in the UI; it recurs if this line is edited.
          uv pip install -e .
          # Self-contained, fully hashed lockfile (includes CPU-only torch).
          #   --require-hashes : forbids resolving/downloading any unpinned or
          #                      unhashed version (dependency-substitution guard).
          #   --only-binary=:all: : blocks setup-script execution (wheels only).
          # The --extra-index-url/--index-strategy let the pinned +cpu torch wheels
          # resolve from the PyTorch CPU index. Regenerate this lockfile whenever
          # requirements-test.txt changes (see header in requirements-test.lock).
          uv pip install --require-hashes --only-binary=:all: --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -r requirements-test.lock

      - name: Run pytest with coverage
        run: |
          source .venv/bin/activate
          pytest --cov=nkululeko --cov-branch tests/
        continue-on-error: false

