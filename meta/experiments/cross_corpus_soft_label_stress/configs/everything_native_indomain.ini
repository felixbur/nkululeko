# Stage C v2 — Condition 5: +Everything (native in-domain).
# SUSAS/WA: original ordinal labels interpolated to [0, 1].
# Emotion/CLSE: model-predicted soft labels (unchanged from everything_soft).

[EXP]
root = ./experiments/stresspaper/v2/results/stage_c/
name = everything_native_indomain
runs = 3
epochs = 200
type = regression
save = True

[DATA]
databases = ['stressdat', 'susas_native', 'wa_native', 'emodb_soft', 'emovo_soft', 'msp_soft', 'clse_soft', 'acted_stress']
stressdat = /data/audb/stressdat/1.2.0/d3b62a9b
stressdat.split_strategy = specified
stressdat.train_tables = ['segments.train']
stressdat.dev_tables = ['segments.dev']
susas_native = ./experiments/stresspaper/v2/labels/native/susas_native_labels.csv
susas_native.type = csv
susas_native.split_strategy = train
susas_native.colnames = {'stress': 'stress'}
wa_native = ./experiments/stresspaper/v2/labels/native/wa_native_labels.csv
wa_native.type = csv
wa_native.split_strategy = train
wa_native.colnames = {'stress': 'stress'}
emodb_soft = ./experiments/stresspaper/v2/labels/soft/emodb_soft_labels.csv
emodb_soft.type = csv
emodb_soft.split_strategy = train
emodb_soft.colnames = {'predicted': 'stress'}
emovo_soft = ./experiments/stresspaper/v2/labels/soft/emovo_soft_labels.csv
emovo_soft.type = csv
emovo_soft.split_strategy = train
emovo_soft.colnames = {'predicted': 'stress'}
msp_soft = ./experiments/stresspaper/v2/labels/soft/msp_soft_labels.csv
msp_soft.type = csv
msp_soft.split_strategy = train
msp_soft.colnames = {'predicted': 'stress'}
clse_soft = ./experiments/stresspaper/v2/labels/soft/clse_soft_labels.csv
clse_soft.type = csv
clse_soft.split_strategy = train
clse_soft.colnames = {'predicted': 'stress'}
acted_stress = /data/audb/acted-stress/1.0.0/fe182b91
acted_stress.split_strategy = test
acted_stress.target_tables = ['files']
acted_stress.columns = ['stress_ewe']
acted_stress.colnames = {'stress_ewe': 'stress'}
target = stress

[FEATS]
type = ['wav2vec2']
wav2vec2.model = facebook/wav2vec2-large-robust-ft-swbd-300h
wav2vec2.layer = 18
scale = standard

[MODEL]
type = mlp_reg
layers = [1024, 128]
loss = 1-ccc
measure = ccc
patience = 10
optimizer = adamw
weight_decay = 0.01
device = cuda

[PLOT]
best_model = True
epoch_progression = True
