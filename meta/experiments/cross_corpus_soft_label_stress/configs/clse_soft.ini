# v2 — Condition: +CLSE method b) — CLSE soft label only (no SUSAS/WA/emo)

[EXP]
root = ./experiments/stresspaper/v2/results/stage_c/
name = clse_soft
runs = 3
epochs = 200
type = regression
save = True

[DATA]
databases = ['stressdat', 'clse_soft', 'acted_stress']
stressdat = /data/audb/stressdat/1.2.0/d3b62a9b
stressdat.split_strategy = specified
stressdat.train_tables = ['segments.train']
stressdat.dev_tables = ['segments.dev']
clse_soft = ./experiments/stresspaper/v2/labels/soft/clse_soft_labels.csv
clse_soft.type = csv
clse_soft.split_strategy = train
clse_soft.colnames = {'predicted': 'stress'}
acted_stress = /data/audb/acted-stress/1.0.0/fe182b91
acted_stress.split_strategy = test
acted_stress.target_tables = ['files']
acted_stress.columns = ['stress_ewe']
acted_stress.colnames = {'stress_ewe': 'stress'}
target = stress

[FEATS]
type = ['wav2vec2']
wav2vec2.model = facebook/wav2vec2-large-robust-ft-swbd-300h
wav2vec2.layer = 18
scale = standard

[MODEL]
type = mlp_reg
layers = [1024, 128]
loss = 1-ccc
measure = ccc
patience = 10
optimizer = adamw
weight_decay = 0.01
device = cuda

[PLOT]
best_model = True
epoch_progression = True
