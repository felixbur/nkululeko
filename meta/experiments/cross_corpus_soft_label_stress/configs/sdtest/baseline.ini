# v2 in-domain evaluation — Baseline
# train=segments.train, dev=segments.dev (early stopping), test=segments.test

[EXP]
root = ./experiments/stresspaper/v2/results/sdtest/
name = baseline
runs = 3
epochs = 200
type = regression
save = True

[DATA]
databases = ['stressdat']
stressdat = /data/audb/stressdat/1.2.0/d3b62a9b
stressdat.split_strategy = specified
stressdat.train_tables = ['segments.train']
stressdat.dev_tables = ['segments.dev']
stressdat.test_tables = ['segments.test']
target = stress

[FEATS]
type = ['wav2vec2']
wav2vec2.model = facebook/wav2vec2-large-robust-ft-swbd-300h
wav2vec2.layer = 18
scale = standard

[MODEL]
type = mlp_reg
layers = [1024, 128]
loss = 1-ccc
measure = ccc
patience = 10
optimizer = adamw
weight_decay = 0.01
device = cuda

[PLOT]
best_model = True
epoch_progression = True
