# AASIST + domain-adversarial training (DANN) against the database a
# training clip came from (source_db: itw / la / cvoicefake / habla), so the
# representation cannot tell the four training corpora apart.
# Train: itw + la + cvoicefake + habla (2500 real + 2500 fake each).
# Dev (early stopping): for2sec. Test (held out): had. See ../REPORT.md for
# how the CSVs are built and what the results were.
#
# runs = N trains N models with different random initialisations (nkululeko
# fixes no seed unless [MODEL] random_seed is set); report the mean and std of
# the test EER over the runs, not a single run.

[EXP]
root = ./results/aasist_had_dann_source_db
name = aasist_had_dann_source_db
epochs = 50
runs = 8
save = False
traindevtest = True

[DATA]
itw = ./data/multidb_ood/_aasist_subsample_2500_lang/itw.csv
itw.type = csv
itw.absolute_path = False
itw.audio_path = ./data/itw/release_in_the_wild
itw.split_strategy = train

la = ./data/multidb_ood/_aasist_subsample_2500_lang/la.csv
la.type = csv
la.absolute_path = False
la.audio_path = ./data
la.split_strategy = train

cvoicefake = ./data/multidb_ood/_aasist_subsample_2500_lang/cvoicefake.csv
cvoicefake.type = csv
cvoicefake.absolute_path = False
cvoicefake.audio_path = ./data/CVoiceFake_small
cvoicefake.split_strategy = train

habla = ./data/multidb_ood/_aasist_subsample_2500_lang/habla.csv
habla.type = csv
habla.absolute_path = False
habla.audio_path = ./data
habla.split_strategy = train

for2sec = ./data/multidb_ood/_aasist_subsample_2500_lang/for2sec.csv
for2sec.type = csv
for2sec.absolute_path = False
for2sec.audio_path = ./data/for-2sec
for2sec.split_strategy = dev

had = ./data/multidb_ood/_aasist_subsample_2500_lang/had.csv
had.type = csv
had.absolute_path = False
had.audio_path = ./data
had.split_strategy = test

databases = ['itw', 'la', 'cvoicefake', 'habla', 'for2sec', 'had']
target = label
labels = ['fake', 'real']
no_reuse = True

[FEATS]
type = []

[MODEL]
n_jobs = 8
type = aasist
measure = eer
patience = 5
learning_rate = 0.00001
optimizer = adam
loss = cross
dann_columns = ['source_db']
dann_lambda = 1.0
dann_weight = 1.0
dann_reverse = True

[AASIST]
batch_size = 16
ssl_layer_pooling = last
freeze_ssl_frontend = False

[PLOT]
best_model = True
