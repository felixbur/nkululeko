# Minimal binary AASIST example: SSL frontend + AASIST back end trained
# end to end on raw audio. AASIST is a two-class model, so restrict the
# labels to two classes. FEATS.type must be empty (the model reads audio).
[EXP]
root = ./examples/results/
name = aasist_emodb
runs = 1
epochs = 5
save = True
[DATA]
databases = ['emodb']
emodb = ./data/emodb/emodb
emodb.split_strategy = specified
emodb.test_tables = ['emotion.categories.test.gold_standard']
emodb.train_tables = ['emotion.categories.train.gold_standard']
labels = ['anger', 'sadness']
target = emotion
[FEATS]
type = []
[MODEL]
type = aasist
; learning_rate = 0.00001
; device = cpu
[AASIST]
ssl_model = facebook/wav2vec2-base
batch_size = 8
; max_len = 64600
; ssl_layer_pooling = last
; freeze_ssl_frontend = False
