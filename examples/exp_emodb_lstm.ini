# Minimal LSTM example: the model reads the audio itself, computes a
# frame sequence (mel spectrogram or opensmile LLDs, see RNN.feature_source)
# and classifies it with a recurrent network that is mean-pooled over
# time. FEATS.type must be empty. For regression use MODEL.type = lstm_reg.
[EXP]
root = ./examples/results/
name = lstm_emodb
runs = 1
epochs = 20
save = True
[DATA]
databases = ['emodb']
emodb = ./data/emodb/emodb
emodb.split_strategy = specified
emodb.test_tables = ['emotion.categories.test.gold_standard']
emodb.train_tables = ['emotion.categories.train.gold_standard']
labels = ['anger', 'happiness', 'sadness', 'neutral']
target = emotion
[FEATS]
type = []
[MODEL]
type = lstm
; learning_rate = 0.001
; drop = 0.1
; device = cpu
[RNN]
feature_source = melspec
; feature_source = opensmile_lld
; opensmile_set = eGeMAPSv02
; n_mels = 64
; hidden_size = 64
; num_layers = 2
; bidirectional = False
; batch_size = 32
; max_len = 64600
