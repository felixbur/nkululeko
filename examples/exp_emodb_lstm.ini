# Minimal LSTM example: opensmile low-level descriptors as frame
# sequences (FEATS.level = frame), one emotion label per utterance, an
# LSTM mean-pooled over time. For regression use MODEL.type = lstm_reg
# with [EXP] type = regression.
[EXP]
root = ./examples/results/
name = lstm_emodb
runs = 1
epochs = 20
save = True
[DATA]
databases = ['emodb']
emodb = ./data/emodb/emodb
emodb.split_strategy = specified
emodb.test_tables = ['emotion.categories.test.gold_standard']
emodb.train_tables = ['emotion.categories.train.gold_standard']
labels = ['anger', 'happiness', 'sadness', 'neutral']
target = emotion
[FEATS]
type = ['os']
level = frame
scale = standard
[MODEL]
type = lstm
; learning_rate = 0.001
; drop = 0.1
; device = cpu
[RNN]
; hidden_size = 64
; num_layers = 2
; bidirectional = False
; batch_size = 32
