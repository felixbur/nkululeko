[EXP]
root = ./examples/results/multidb
epochs = 100
databases = ['emodb', 'crema-d']
use_splits = True
; reuse_train = True  ; train each database once and reuse it across the
                       ; row instead of retraining per (train, test) pair -
                       ; see ini_file.md. Not shown enabled here so this
                       ; example still exercises the default per-pair path.
[DATA]
root_folders = ./tests/data_roots.ini
crema-d.limit_samples = 1000
target = emotion
labels = ['neutral', 'happy', 'sad', 'angry']
[FEATS]
type = ['os']
scale = standard
[MODEL]
type = mlp
layers = {'l1':100, 'l2':16}
patience = 3
[PLOT]
best_model = True
epoch_progression = True
