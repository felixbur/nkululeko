[EXP]
root = ./examples/results/
name = exp_emodb_mlp_dann
runs = 1
epochs = 5
save = True
[DATA]
databases = ['emodb']
emodb = ./data/emodb/emodb
emodb.split_strategy = speaker_split
emodb.files_tables = ['emotion']
emodb.mapping = {'anger':'angry', 'happiness':'happy', 'sadness':'sad', 'neutral':'neutral'}
labels = ['angry', 'sad']
target = emotion
[FEATS]
type = ['audwav2vec2']
scale = standard
[MODEL]
type = mlp
n_jobs = 8
layers = [14, 8]
drop = .4
# Unlearn gender: a head predicts it from the last hidden layer through a
# gradient-reversal layer, pushing the features to be gender-invariant.
# For cross-corpus data use dann_columns = ['source_db'].
dann_columns = ['gender']
; dann_lambda = 1.0
; dann_weight = 1.0
; dann_reverse = True
[PLOT]
best_model = True
epoch_progression = True
