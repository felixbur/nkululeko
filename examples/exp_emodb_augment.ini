[EXP]
root = ./examples/results/
name = exp_emodb_augment
sample_selection = all
[DATA]
databases = ['emodb']
emodb = ./data/emodb/emodb
emodb.test_tables = ['emotion.categories.test.gold_standard']
emodb.train_tables = ['emotion.categories.train.gold_standard']
emodb.columns = ['emotion']
emodb.filter = {'emotion': ['anger', 'happiness']}
[AUGMENT]
augment = ['auglib']
transformations = ['music', 'room', 'cough', 'noise', 'babble']
bypass_prob = .5

