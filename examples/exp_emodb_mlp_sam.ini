[EXP]
root = ./examples/results/
name = exp_emodb_mlp_sam
runs = 1
epochs = 5
save = True
[DATA]
databases = ['emodb']
emodb = ./data/emodb/emodb
emodb.split_strategy = speaker_split
emodb.files_tables = ['emotion']
emodb.mapping = {'anger':'angry', 'happiness':'happy', 'sadness':'sad', 'neutral':'neutral'}
labels = ['angry', 'sad']
target = emotion
[FEATS]
type = ['audwav2vec2']
scale = standard
[MODEL]
type = mlp
n_jobs = 8
layers = [14, 8]
drop = .4
# Sharpness-Aware Minimization: each step also looks at the worst point within
# sam_rho of the weights, which favours flat minima that transfer better to
# unseen corpora. Twice the cost per batch.
sam = True
; sam_rho = 0.05
[PLOT]
best_model = True
epoch_progression = True
