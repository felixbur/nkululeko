[EXP]
root = ./examples/results/
name = emodb_split_column
epochs = 100
[DATA]
databases = ['emodb']
emodb = ./data/emodb/emodb
# split_column ("gender" here) must be listed in DATA.<db>.columns, or it
# won't be loaded into the dataframe and split_strategy=column will fail
# with "split_column '...' not found in the data".
emodb.columns = ["age", "gender"]
emodb.files_tables = ['emotion.categories.test.gold_standard', 'emotion.categories.train.gold_standard', 'emotion.categories.ambiguous']
emodb.split_strategy = column
emodb.split_column = gender
emodb.train_vals = ['male']
emodb.test_vals = ['female']
emodb.filter = {'emotion': ['anger', 'happiness']}
target = emotion
labels = ["anger", "happiness"]
[FEATS]
type = ['os']
[MODEL]
type = xgb
