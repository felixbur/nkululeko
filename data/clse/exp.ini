# Example: CLSE cognitive load classification (3 classes: low / medium / high)
# Run process_database.py first to generate the CSV file lists.
# Usage: python -m nkululeko.nkululeko --config data/clse/exp.ini

[EXP]
root = ./results/
name = clse_cog_load
runs = 1
epochs = 100

[DATA]
databases = ['clse_train', 'clse_dev', 'clse_test']
clse_train = data/clse/clse_train.csv
clse_train.type = csv
clse_train.split_strategy = train
clse_dev = data/clse/clse_dev.csv
clse_dev.type = csv
clse_dev.split_strategy = dev
clse_test = data/clse/clse_test.csv
clse_test.type = csv
clse_test.split_strategy = test
target = objective_cognitive_load
labels = [1, 2, 3]

[FEATS]
type = ['wav2vec2']
wav2vec2.model = facebook/wav2vec2-large-robust-ft-swbd-300h
wav2vec2.layer = 18
scale = standard

[MODEL]
type = mlp
layers = [1024, 128]
loss = cross_entropy
measure = uar
patience = 10
optimizer = adamw
weight_decay = 0.01
device = cuda
