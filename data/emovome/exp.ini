# Example: EMOVOME 3-class valence classification (negative/neutral/positive)
# from the transcript text alone, via BERT embeddings -- no (restricted)
# audio content is used; FEATS.type = ['bert'] ignores it entirely.
# Run process_database.py first to generate the CSV file lists (see README.md).
# Usage (from this directory, data/emovome/):
#   python -m nkululeko.nkululeko exp.ini

[EXP]
root = ./results/
name = emovome_valence
runs = 1
epochs = 30
traindevtest = True
save = True

[DATA]
databases = ['emovome_train', 'emovome_dev', 'emovome_test']
emovome_train = emovome_train.csv
emovome_train.type = csv
emovome_train.absolute_path = True
emovome_train.split_strategy = train
emovome_dev = emovome_dev.csv
emovome_dev.type = csv
emovome_dev.absolute_path = True
emovome_dev.split_strategy = dev
emovome_test = emovome_test.csv
emovome_test.type = csv
emovome_test.absolute_path = True
emovome_test.split_strategy = test
target = valence
labels = ['negative', 'neutral', 'positive']

[FEATS]
type = ['bert']
bert.model = google-bert/bert-base-multilingual-cased
bert.text_column = transcription
scale = standard

[MODEL]
type = mlp
layers = {'l1': 64}
patience = 5
optimizer = adamw
device = cpu

[EXPL]
sample_selection = all
value_counts = [['valence'], ['arousal'], ['category'], ['gender'], ['age_range']]
